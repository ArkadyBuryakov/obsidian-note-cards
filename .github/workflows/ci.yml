name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # same rules the Obsidian community directory runs on submitted plugins
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # only what gets bundled into main.js
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
